# Mnemos — full local platform. Every image here is free and self-hosted.
# No cloud account, no API key, no paid tier is required to run any of it.
#
#   make up          bring the whole stack up
#   make logs        follow everything
#   make down        stop (volumes preserved)
#
# Service boundaries are deliberate: the API, the ingestion worker, the realtime
# gateway and the web app are separate containers because they scale on different
# signals and fail independently.

name: mnemos

x-backend-env: &backend-env
  MNEMOS_ENV: local
  MNEMOS_DATABASE_URL: postgresql+asyncpg://mnemos:mnemos@postgres:5432/mnemos
  MNEMOS_REDIS_URL: redis://redis:6379/0
  MNEMOS_OBJECT_ENDPOINT: http://minio:9000
  MNEMOS_OBJECT_ACCESS_KEY: mnemos
  MNEMOS_OBJECT_SECRET_KEY: mnemos-dev-secret
  MNEMOS_OBJECT_BUCKET: mnemos-documents
  MNEMOS_OLLAMA_BASE_URL: http://ollama:11434
  MNEMOS_OLLAMA_MODEL: qwen2.5:3b-instruct
  MNEMOS_EMBEDDER: hashing
  # Split-horizon OIDC: the browser must reach Keycloak on a public URL while the
  # API resolves it over the compose network. Using one URL for both is the classic
  # "issuer mismatch" failure in containerised OIDC.
  MNEMOS_OIDC_ISSUER_PUBLIC: http://localhost:8080/realms/mnemos
  MNEMOS_OIDC_ISSUER_INTERNAL: http://keycloak:8080/realms/mnemos
  MNEMOS_OIDC_CLIENT_ID: mnemos-web
  MNEMOS_JWT_SECRET: dev-only-change-me
  PYTHONUNBUFFERED: "1"

services:
  # ---------------------------------------------------------------- data tier
  postgres:
    # pgvector ships as a first-class image; no extension build step needed.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mnemos
      POSTGRES_PASSWORD: mnemos
      POSTGRES_DB: mnemos
      # Deterministic collation so ORDER BY is stable across machines.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mnemos -d mnemos"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    # S3-compatible object storage. This is what makes the cloud-connector
    # abstraction exercisable for free: the S3 adapter talks to MinIO locally
    # and to AWS in production without a code change.
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mnemos
      MINIO_ROOT_PASSWORD: mnemos-dev-secret
    volumes: [miniodata:/data]
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 mnemos mnemos-dev-secret &&
      mc mb --ignore-existing local/mnemos-documents &&
      mc mb --ignore-existing local/mnemos-uploads &&
      echo 'buckets ready'
      "
    restart: "no"

  # ------------------------------------------------------------- identity tier
  keycloak:
    # Real OIDC provider, free and self-hosted. Realm is imported at boot so the
    # stack comes up already configured — no manual admin console clicking.
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # ------------------------------------------------------------ inference tier
  ollama:
    image: ollama/ollama:latest
    volumes: [ollamadata:/root/.ollama]
    ports: ["11434:11434"]
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  ollama-init:
    # Pulls the model once into the shared volume. Idempotent: re-running is a
    # no-op when the model is already present.
    image: ollama/ollama:latest
    depends_on:
      ollama: {condition: service_healthy}
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull qwen2.5:3b-instruct && echo 'model ready'"]
    volumes: [ollamadata:/root/.ollama]
    restart: "no"

  # ---------------------------------------------------------- application tier
  migrate:
    # Migrations run as a one-shot job before the API starts, never on app boot.
    # Boot-time migrations race across replicas and turn a rollout into a lottery.
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment: *backend-env
    depends_on:
      postgres: {condition: service_healthy}
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment: *backend-env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    command: ["uvicorn", "mnemos.entrypoints.api.main:app",
              "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  worker:
    # Ingestion: extract, chunk, embed, index. Separate container because it is
    # CPU-bound and bursty, while the API is latency-sensitive.
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment: *backend-env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    command: ["python", "-m", "mnemos.entrypoints.worker.main"]
    restart: unless-stopped

  realtime:
    # WebSocket gateway. Separate container because connection count, not request
    # rate, is its scaling signal.
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment: *backend-env
    depends_on:
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    command: ["uvicorn", "mnemos.entrypoints.realtime.main:app",
              "--host", "0.0.0.0", "--port", "8001", "--proxy-headers"]
    ports: ["8001:8001"]
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8001
      NEXT_PUBLIC_OIDC_ISSUER: http://localhost:8080/realms/mnemos
      NEXT_PUBLIC_OIDC_CLIENT_ID: mnemos-web
    depends_on:
      api: {condition: service_healthy}
    ports: ["3000:3000"]
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
  ollamadata:
