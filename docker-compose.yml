# Mnemos — full local platform. Every image here is free and self-hosted.
# No cloud account, no API key, no paid tier is required to run any of it.
#
#   make up          bring the whole stack up
#   make logs        follow everything
#   make down        stop (volumes preserved)
#
# Service boundaries are deliberate: the API, the ingestion worker, the realtime
# gateway and the web app are separate containers because they scale on different
# signals and fail independently.

name: mnemos

x-backend-env: &backend-env
  MNEMOS_ENV: local
  # The application connects as `mnemos_app`, which is NOSUPERUSER NOBYPASSRLS, so
  # the row-level security policies from migration 0004 actually apply to it.
  # `migrate` overrides this with the owning superuser below — RLS must not
  # obstruct DDL, and it never applies to a superuser anyway.
  MNEMOS_DATABASE_URL: postgresql+asyncpg://mnemos_app:mnemos-app-dev@postgres:5432/mnemos
  # Read by migration 0005, which creates the role above. Duplicated into the DSN
  # rather than assembled from parts, so what the app connects with is readable in
  # one line; the two must agree.
  MNEMOS_APP_DATABASE_PASSWORD: mnemos-app-dev
  MNEMOS_REDIS_URL: redis://redis:6379/0
  MNEMOS_OBJECT_ENDPOINT: http://minio:9000
  MNEMOS_OBJECT_ACCESS_KEY: mnemos
  MNEMOS_OBJECT_SECRET_KEY: mnemos-dev-secret
  MNEMOS_OBJECT_BUCKET: mnemos-documents
  MNEMOS_OLLAMA_BASE_URL: http://ollama:11434
  MNEMOS_OLLAMA_MODEL: qwen2.5:3b-instruct
  MNEMOS_EMBEDDER: hashing
  # Same Postgres instance, second database (deploy/postgres/init/02-analytics-seed.sql),
  # `mnemos_ro` — a role that physically cannot write, the second of NL2SQL's two
  # independent read-only defences.
  MNEMOS_ANALYTICS_DATABASE_URL: postgresql+asyncpg://mnemos_ro:mnemos_ro_dev@postgres:5432/mnemos_analytics
  # Split-horizon OIDC: the browser must reach Keycloak on a public URL while the
  # API resolves it over the compose network. Using one URL for both is the classic
  # "issuer mismatch" failure in containerised OIDC.
  MNEMOS_OIDC_ISSUER_PUBLIC: http://localhost:8080/realms/mnemos
  MNEMOS_OIDC_ISSUER_INTERNAL: http://keycloak:8080/realms/mnemos
  MNEMOS_OIDC_CLIENT_ID: mnemos-web
  # M3.4 requires at least 32 bytes — an HMAC-SHA256 key shorter than its own
  # digest adds no security over a 32-byte one and signals a value nobody chose
  # deliberately. The old 19-byte placeholder here crash-looped the API on
  # startup the first time the whole stack was rebuilt from source.
  # `core/config.py` separately refuses to start in production while this is
  # still the development default, so a real deployment cannot inherit it.
  MNEMOS_JWT_SECRET: dev-only-change-me-this-is-not-a-real-secret-32b+
  # The deployment-operator boundary around the local-filesystem connector
  # (`B1` deliverable 1) — empty (default-deny) unless a real path is opted
  # in. `/fixtures/sources` is the one path this compose file actually
  # mounts (below), the same fixture directory both `api` (register/browse)
  # and `worker` (fetch) need to see, at the same container path, for the
  # sources UI's local-fs flow to work at all — in dev and in the deliverable
  # 5 Playwright spec alike.
  MNEMOS_LOCAL_FS_ALLOWED_ROOTS: '["/fixtures/sources"]'
  PYTHONUNBUFFERED: "1"

# The browser-facing configuration, in one place because it is needed twice: as
# build arguments (NEXT_PUBLIC_* is inlined into the client bundle by `next
# build`) and as container environment (read by the server process). Two copies
# would eventually disagree, and the symptom would be a page that works on the
# server and calls the wrong host in the browser.
x-web-env: &web-env
  NEXT_PUBLIC_API_URL: http://localhost:8000
  NEXT_PUBLIC_WS_URL: ws://localhost:8001
  NEXT_PUBLIC_OIDC_ISSUER: http://localhost:8080/realms/mnemos
  NEXT_PUBLIC_OIDC_CLIENT_ID: mnemos-web

services:
  # ---------------------------------------------------------------- data tier
  postgres:
    # pgvector ships as a first-class image; no extension build step needed.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mnemos
      POSTGRES_PASSWORD: mnemos
      POSTGRES_DB: mnemos
      # Deterministic collation so ORDER BY is stable across machines.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    # Host port 15432: a system Postgres already owns 5432 on this machine.
    # Container-to-container traffic still uses 5432 over the compose network.
    ports: ["15432:5432"]
    healthcheck:
      # Probe TCP so the temporary socket-only init server never reports ready.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U mnemos -d mnemos"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    ports: ["6380:6379"]   # avoid clashing with a host redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    # S3-compatible object storage. This is what makes the cloud-connector
    # abstraction exercisable for free: the S3 adapter talks to MinIO locally
    # and to AWS in production without a code change.
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mnemos
      MINIO_ROOT_PASSWORD: mnemos-dev-secret
    volumes: [miniodata:/data]
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 mnemos mnemos-dev-secret &&
      mc mb --ignore-existing local/mnemos-documents &&
      mc mb --ignore-existing local/mnemos-uploads &&
      echo 'buckets ready'
      "
    restart: "no"

  logs-init:
    # `./logs` does not exist on a fresh clone (it is gitignored — nothing ever
    # commits it), so Docker auto-creates it on first mount, owned by root. `api`
    # runs as an unprivileged image user (`Dockerfile`'s `USER mnemos`, uid 10001)
    # and cannot then write into it — the same "bind mount source must exist with
    # the right ownership first" problem `minio-init` solves for the bucket, one
    # layer down at the filesystem instead of the object store.
    image: busybox:latest
    volumes:
      - ./logs:/app/logs
    entrypoint: ["sh", "-c", "mkdir -p /app/logs/sessions && chown -R 10001:10001 /app/logs"]
    restart: "no"

  # ------------------------------------------------------------- identity tier
  keycloak:
    # Real OIDC provider, free and self-hosted. Realm is imported at boot so the
    # stack comes up already configured — no manual admin console clicking.
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # ------------------------------------------------------------ inference tier
  ollama:
    image: ollama/ollama:latest
    volumes: [ollamadata:/root/.ollama]
    ports: ["11434:11434"]
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  ollama-init:
    # Pulls the model once into the shared volume. Idempotent: re-running is a
    # no-op when the model is already present.
    image: ollama/ollama:latest
    depends_on:
      ollama: {condition: service_healthy}
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull qwen2.5:3b-instruct && echo 'model ready'"]
    volumes: [ollamadata:/root/.ollama]
    restart: "no"

  # ---------------------------------------------------------- application tier
  migrate:
    # Migrations run as a one-shot job before the API starts, never on app boot.
    # Boot-time migrations race across replicas and turn a rollout into a lottery.
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      <<: *backend-env
      # Alembic connects as the table owner. This is the only service that does.
      MNEMOS_DATABASE_URL: postgresql+asyncpg://mnemos:mnemos@postgres:5432/mnemos
    depends_on:
      postgres: {condition: service_healthy}
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      <<: *backend-env
      # Off everywhere else (`core/config.py`'s default) so only the services
      # that resolve a caller's session write per-session log files. `./logs`
      # below is what puts them in the repo's own working tree instead of
      # vanishing with the container.
      MNEMOS_SESSION_LOG_ENABLED: "true"
    volumes:
      - ./logs:/app/logs
      # Read-only: the local-fs connector only ever lists and fetches, never
      # writes back to a source. Same directory, same path, as `worker` below —
      # register (here) and fetch (there) have to agree on what a `root`/`uri`
      # resolves to.
      - ./e2e-fixtures/sources:/fixtures/sources:ro
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
      migrate: {condition: service_completed_successfully}
      logs-init: {condition: service_completed_successfully}
    command: ["uvicorn", "mnemos.entrypoints.api.main:app",
              "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  worker:
    # Ingestion: extract, chunk, embed, index. Separate container because it is
    # CPU-bound and bursty, while the API is latency-sensitive.
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment: *backend-env
    volumes: ["./e2e-fixtures/sources:/fixtures/sources:ro"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    command: ["python", "-m", "mnemos.entrypoints.worker.main"]
    restart: unless-stopped

  realtime:
    # WebSocket gateway. Separate container because connection count, not request
    # rate, is its scaling signal.
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment: *backend-env
    depends_on:
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    command: ["uvicorn", "mnemos.entrypoints.realtime.main:app",
              "--host", "0.0.0.0", "--port", "8001", "--proxy-headers"]
    ports: ["8001:8001"]
    restart: unless-stopped

  web:
    # The Next.js app shell (F0). No profile: `docker compose up -d` brings the
    # frontend up with everything else, because a stack whose UI needs a
    # remembered extra flag is a stack whose UI does not get looked at.
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # A NEXT_PUBLIC_* value is inlined into the *browser* bundle at build
      # time. Passing it only in `environment` below reaches the server process
      # and never the browser, which is the quiet way an app ends up calling the
      # wrong API. Both are set from the same anchor so they cannot disagree.
      args: *web-env
    environment: *web-env
    depends_on:
      api: {condition: service_healthy}
    ports: ["3000:3000"]
    healthcheck:
      # Node 24 has global fetch, so this needs no curl in the image. Without a
      # healthcheck `docker compose ps` would report `web` as merely running,
      # and "the frontend is up" would be a claim about a process rather than
      # about a page.
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
  ollamadata:
