[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os

# Revisions are named `NNNN_slug` and ordered by their `down_revision` chain.
# The numeric prefix is for humans reading `ls`; Alembic still walks the chain.
file_template = %%(rev)s_%%(slug)s

# The URL is intentionally absent. `env.py` reads MNEMOS_DATABASE_URL through the
# same Settings object the application uses, so migrations cannot be pointed at a
# database the app would refuse to talk to.
sqlalchemy.url =

[post_write_hooks]
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
