# Mnemos public edge: nginx terminates TLS (Let's Encrypt via certbot) and
# proxies each hostname to a container port published on 127.0.0.1 only.
# certbot --nginx adds the listen 443 / ssl_certificate lines and the
# HTTP->HTTPS redirects to these blocks; re-run it after editing server_name.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server_tokens off;

# Web app (Next.js)
server {
    listen 80;
    listen [::]:80;
    server_name mnemos.harsha2803.dev;
    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/mnemos-proxy.conf;
    }
}

# API (FastAPI). Chat answers stream over SSE, so response buffering is off.
server {
    listen 80;
    listen [::]:80;
    server_name mnemos-api.harsha2803.dev;
    client_max_body_size 26m;   # MNEMOS_MAX_UPLOAD_BYTES is 25 MiB
    location / {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/mnemos-proxy.conf;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}

# Realtime WebSocket gateway
server {
    listen 80;
    listen [::]:80;
    server_name mnemos-ws.harsha2803.dev;
    location / {
        proxy_pass http://127.0.0.1:8001;
        include /etc/nginx/snippets/mnemos-proxy.conf;
        proxy_read_timeout 3600s;
    }
}

# Keycloak (OIDC). Its responses carry large headers.
server {
    listen 80;
    listen [::]:80;
    server_name mnemos-auth.harsha2803.dev;
    # The admin console is not public; reach it over an SSH tunnel to
    # 127.0.0.1:8080 instead (docs/Deploy.md).
    location /admin/ {
        return 403;
    }
    location / {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/mnemos-proxy.conf;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
