# Shared reverse-proxy headers for every Mnemos host (included per location).
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
# Overwritten, not appended: nginx is the edge, and the API trusts this header
# from any peer (FORWARDED_ALLOW_IPS=*), so a client-supplied value must not survive.
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;
